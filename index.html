<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love you Samir</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Happy Valentine's Day! Mi amor 💖</h1>

        <div class="photos">
            <img id="photo" src="photo1.jpg" alt="Love Photo 1" />
            <p id="quote">"Eres mi hermoso, eres mi amor lindo!"</p> <!-- Quote under the photo -->
        </div>

        <blockquote>
            "Te amo! Quiero pasar mas dias de san valentin contigo." 💫
        </blockquote>

        <div class="question">
            <h2>Will you be my forever?</h2>
            <button id="yes-btn">Yes! ❤️</button>
            <button id="no-btn">No 😞</button>
        </div>

        <!-- Next photo button -->
        <button id="next-btn">Next Photo</button>

        <!-- Background music player -->
        <audio id="background-music" loop>
            <source src="your-song.mp3" type="audio/mp3">
    
</audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
